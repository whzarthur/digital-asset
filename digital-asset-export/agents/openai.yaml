interface:
  display_name: "数字资产"
  short_description: "逐项生成、确认并同步工作台的数字资产图片"
  default_prompt: "使用 $digital-asset-export 读取灵创工作台的项目、分镜图和已有资产，逐项生成图片；每完成人物、场景或物品资产都先让我确认，确认后立即同步，再继续下一项。"
dependencies:
  tools:
    - type: "mcp"
      value: "film-workbench"
      description: "读取灵创工作台项目、真实分镜图、已有资产和动态 assets 契约，并在明确授权后上传、校验和写回图片资产"
